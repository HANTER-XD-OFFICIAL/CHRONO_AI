name: Publish Tagged Release APK

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare .env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i '/GEMINI_API_KEY/d' .env || true
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Prepare Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/CHRONO-AI-${TAG_NAME}.apk"
          fi
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CHRONO AI ${{ github.ref_name }}"
          files: dist/*.apk
          body: |
            ## 📱 CHRONO AI Android Application (${{ github.ref_name }})
            
            Human-like conversational & coding assistant with dual-engine architecture (Google Gemini 3.5 Online + On-Device Autonomous Offline Engine).
            
            ### ⬇️ Installation:
            1. Download the `CHRONO-AI-${{ github.ref_name }}.apk` file below.
            2. Open the downloaded file on your Android device.
            3. Allow installation from unknown sources if prompted.
            4. Enjoy using CHRONO AI offline and online!
          generate_release_notes: true
